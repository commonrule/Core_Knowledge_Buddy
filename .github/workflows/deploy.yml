name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # No API key here by design: it lives in the Cloudflare Worker, not in the page.
      # STUDY_BUDDY_API is a repository *variable* (the proxy URL is not sensitive);
      # if it is unset the app falls back to the URL baked into js/app.js.
      - name: Inject runtime config
        run: |
          echo "window.STUDY_BUDDY_API = '${{ vars.STUDY_BUDDY_API }}';" > config.js
          echo "window.SUPABASE_URL = '${{ secrets.SUPABASE_URL }}';" >> config.js
          echo "window.SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}';" >> config.js

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
        id: deployment
